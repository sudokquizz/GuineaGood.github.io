<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Politique de confidentialité — GuineaGood</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      .privacy-shell {
        max-width: 960px;
        margin: 48px auto;
        padding: 0 16px 48px;
      }

      .policy-card {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px 22px;
        box-shadow: 0 20px 40px rgba(24, 56, 38, 0.08);
      }

      #policy-status {
        margin: 0 0 18px;
        color: var(--muted);
        font-weight: 600;
      }

      .md-content h1,
      .md-content h2,
      .md-content h3 {
        color: var(--accent);
        margin-top: 1.6em;
      }

      .md-content h1:first-child,
      .md-content h2:first-child,
      .md-content h3:first-child {
        margin-top: 0;
      }

      .md-content p,
      .md-content li {
        color: var(--text);
        line-height: 1.8;
      }

      .md-content a {
        color: var(--primary-strong);
      }

      .md-content code {
        background: rgba(45, 107, 61, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .md-content ul {
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <header class="hero compact">
      <div class="hero-inner">
        <div class="brand-box small">
          <img class="brand-logo" src="./assets/Accueil-big.png" alt="GuineaGood" />
        </div>
        <div class="hero-copy">
          <div class="top-row">
            <div>
              <p class="eyebrow">GuineaGood</p>
              <h1>Politique de confidentialité</h1>
            </div>
            <div class="lang-switch" aria-label="Sélecteur de langue">
              <button class="lang-btn active" data-lang="fr" type="button">FR</button>
              <button class="lang-btn" data-lang="en" type="button">EN</button>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./index.html" data-i18n="home_btn">Accueil</a>
            <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.guineagood.app" target="_blank" rel="noopener" data-i18n="download_btn">Télécharger</a>
          </div>
        </div>
      </div>
    </header>

    <main class="privacy-shell">
      <div class="policy-card">
        <div id="policy-status">Chargement…</div>
        <article class="md-content" id="policy-content"></article>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>© <span id="year"></span> GuineaGood</span>
        <a href="./index.html">Accueil</a>
      </div>
    </footer>

    <script>
      const translations = {
        fr: {
          home_btn: 'Accueil',
          download_btn: 'Télécharger'
        },
        en: {
          home_btn: 'Home',
          download_btn: 'Download'
        }
      };

      function applyTranslations(lang) {
        const dict = translations[lang] || translations.fr;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) {
            el.textContent = dict[key];
          }
        });
        localStorage.setItem('site_lang', lang);
        loadPolicy(lang);
      }

      const langButtons = [...document.querySelectorAll('.lang-btn')];
      langButtons.forEach(button => {
        button.addEventListener('click', () => {
          applyTranslations(button.dataset.lang);
        });
      });

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function markdownToHtml(markdown) {
        const lines = markdown.replace(/\r/g, '').split('\n');
        let html = '';
        let inList = false;
        let inCode = false;
        let codeLines = [];

        const closeList = () => {
          if (inList) {
            html += '</ul>';
            inList = false;
          }
        };

        const closeCode = () => {
          if (inCode) {
            html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
            inCode = false;
            codeLines = [];
          }
        };

        const inlineMd = (text) => {
          let output = escapeHtml(text);
          output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
          output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          output = output.replace(/\*([^*]+)\*/g, '<em>$1</em>');
          return output;
        };

        for (const line of lines) {
          if (line.startsWith('```')) {
            if (inCode) {
              closeCode();
            } else {
              closeCode();
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
          const listMatch = line.match(/^[-*+]\s+(.*)$/);

          if (headingMatch) {
            closeList();
            const level = headingMatch[1].length;
            html += `<h${level}>${inlineMd(headingMatch[2])}</h${level}>`;
            continue;
          }

          if (listMatch) {
            if (!inList) {
              inList = true;
              html += '<ul>';
            }
            html += `<li>${inlineMd(listMatch[1])}</li>`;
            continue;
          }

          if (line.trim() === '') {
            closeList();
            html += '<p></p>';
            continue;
          }

          html += `<p>${inlineMd(line)}</p>`;
        }

        closeList();
        closeCode();
        return html;
      }

      async function loadPolicy(lang) {
        const status = document.getElementById('policy-status');
        const container = document.getElementById('policy-content');
        const file = lang === 'en' ? './lang/privacy_en.md' : './lang/privacy_fr.md';

        status.textContent = 'Chargement…';
        try {
          const response = await fetch(file, { cache: 'no-cache' });
          if (!response.ok) throw new Error('File not found');
          const markdown = await response.text();
          container.innerHTML = markdownToHtml(markdown);
          status.textContent = '';
        } catch (error) {
          container.innerHTML = '<p>Impossible de charger la politique de confidentialité locale.</p>';
          status.textContent = 'Erreur de chargement';
        }
      }

      document.getElementById('year').textContent = new Date().getFullYear();
      const savedLang = localStorage.getItem('site_lang') === 'en' ? 'en' : 'fr';
      document.querySelector('.lang-btn[data-lang="' + savedLang + '"]').classList.add('active');
      langButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.lang === savedLang);
      });
      loadPolicy(savedLang);
    </script>
  </body>
</html>
